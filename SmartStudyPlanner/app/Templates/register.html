{% extends "base.html" %} {% block title %}Create Account | Smart Study Planner{% endblock %} {% block content %}

<section class="auth-section">
  <div class="auth-container">
    <div class="auth-card register-card">
      <div class="auth-header">
        <div class="auth-icon">🌱</div>

        <h1>Create Your Account</h1>

        <p>Start building a smarter and healthier study routine.</p>
      </div>

      <form method="POST" action="{{ url_for('routes.register') }}">
        <div class="form-row">
          <div class="form-group">
            <label for="name">Full Name</label>

            <input
              type="text"
              id="name"
              name="name"
              placeholder="Enter your name"
              required
            />
          </div>

          <div class="form-group">
            <label for="email">Email Address</label>

            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="password">Password</label>

            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              required
            />
          </div>

          <div class="form-group">
            <label for="confirm_password">Confirm Password</label>

            <input
              type="password"
              id="confirm_password"
              name="confirm_password"
              placeholder="Confirm your password"
              required
            />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="sleep_hours">Average Sleep Hours</label>

            <input
              type="number"
              id="sleep_hours"
              name="sleep_hours"
              min="0"
              max="24"
              step="0.5"
              placeholder="e.g. 7.5"
              required
            />

            <small>This helps us monitor your study fatigue.</small>
          </div>

          <div class="form-group">
            <label for="study_hours">Available Study Hours</label>

            <input
              type="number"
              id="study_hours"
              name="study_hours"
              min="1"
              max="16"
              step="0.5"
              placeholder="e.g. 5"
              required
            />
          </div>
        </div>

        <div class="form-group">
          <label for="mood">How are you feeling today?</label>

          <select id="mood" name="mood" required>
            <option value="">Select your mood</option>
            <option value="happy">😊 Happy</option>
            <option value="neutral">😐 Neutral</option>
            <option value="tired">😴 Tired</option>
            <option value="stressed">😟 Stressed</option>
          </select>
        </div>

        <div class="form-checkbox">
          <label>
            <input type="checkbox" name="terms" required />

            I understand that this application provides study and wellness
            suggestions and is not a medical diagnosis.
          </label>
        </div>

        <button type="submit" class="btn btn-primary btn-full">
          Create My Account
        </button>
      </form>

      <div class="auth-footer">
        <p>
          Already have an account?

          <a href="{{ url_for('routes.login') }}">Login</a>
        </p>
      </div>
    </div>
  </div>
</section>

{% endblock %}
